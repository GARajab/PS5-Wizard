<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>معالج اختيار إصدار PS5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #05070d;
            --bg-2: #0a0f1c;
            --glass: rgba(255, 255, 255, .045);
            --glass-strong: rgba(255, 255, 255, .075);
            --border: rgba(255, 255, 255, .09);
            --text: #f5f7fb;
            --muted: #8b95a8;
            --neon: #3da5ff;
            --neon-soft: rgba(61, 165, 255, .35);
            --ok: #34d399;
            --warn: #fbbf24;
            --bad: #f87171;
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: "IBM Plex Sans Arabic", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Tahoma, sans-serif;
            background: radial-gradient(1200px 700px at 50% -10%, #0d1a33 0%, var(--bg) 60%) fixed;
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            line-height: 1.7;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .35;
            pointer-events: none;
            z-index: 0
        }

        .orb.a {
            width: 420px;
            height: 420px;
            background: #1b6dff;
            top: -120px;
            right: -100px
        }

        .orb.b {
            width: 360px;
            height: 360px;
            background: #0ea5ff;
            bottom: -140px;
            left: -100px;
            opacity: .22
        }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 880px;
            margin: 0 auto;
            padding: clamp(24px, 5vw, 56px) 20px 60px
        }

        header {
            text-align: center;
            margin-bottom: clamp(28px, 5vw, 48px)
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--neon);
            font-size: .8rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .badge i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--neon);
            box-shadow: 0 0 10px var(--neon)
        }

        h1 {
            font-size: clamp(1.9rem, 5.5vw, 3.2rem);
            font-weight: 700;
            letter-spacing: -.01em;
            margin: 18px 0 10px;
            background: linear-gradient(180deg, #fff 30%, #9fb6d8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        header p {
            color: var(--muted);
            font-size: clamp(.95rem, 2.2vw, 1.1rem);
            max-width: 520px;
            margin: 0 auto
        }

        .progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 26px
        }

        .dot {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: .85rem;
            transition: .4s;
        }

        .dot b {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 600;
            font-size: .85rem;
            background: var(--glass);
            border: 1px solid var(--border);
            transition: .4s;
        }

        .dot.active {
            color: var(--text)
        }

        .dot.active b {
            background: var(--neon);
            color: #031225;
            border-color: var(--neon);
            box-shadow: 0 0 18px var(--neon-soft)
        }

        .dot.done b {
            background: rgba(61, 165, 255, .18);
            color: var(--neon);
            border-color: var(--neon-soft)
        }

        .line {
            width: 34px;
            height: 1px;
            background: var(--border)
        }

        @media(max-width:520px) {
            .dot span {
                display: none
            }

            .line {
                width: 22px
            }
        }

        .card {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: clamp(22px, 4.5vw, 44px);
            backdrop-filter: blur(24px) saturate(140%);
            -webkit-backdrop-filter: blur(24px) saturate(140%);
            box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8), inset 0 1px 0 rgba(255, 255, 255, .06);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(140deg, rgba(61, 165, 255, .45), transparent 35%, transparent 65%, rgba(61, 165, 255, .2));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .step {
            display: none;
            opacity: 0;
            transform: translateX(24px)
        }

        .step.show {
            display: block
        }

        .step.in {
            opacity: 1;
            transform: none;
            transition: opacity .55s cubic-bezier(.22, 1, .36, 1), transform .55s cubic-bezier(.22, 1, .36, 1)
        }

        .step.out {
            opacity: 0;
            transform: translateX(-24px);
            transition: opacity .25s ease, transform .25s ease
        }

        .step.back-in {
            transform: translateX(-24px)
        }

        .step.back-in.in {
            transform: none
        }

        .step h2 {
            font-size: clamp(1.3rem, 3.4vw, 1.8rem);
            font-weight: 600;
            margin-bottom: 6px
        }

        .step .sub {
            color: var(--muted);
            margin-bottom: 26px;
            font-size: .98rem
        }

        .options {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr))
        }

        .opt {
            font: inherit;
            color: inherit;
            text-align: right;
            cursor: pointer;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform .35s cubic-bezier(.22, 1, .36, 1), border-color .3s, box-shadow .35s, background .3s;
        }

        .opt:hover,
        .opt:focus-visible {
            transform: translateY(-4px);
            border-color: var(--neon);
            outline: none;
            background: rgba(61, 165, 255, .08);
            box-shadow: 0 14px 40px -14px var(--neon-soft), 0 0 0 1px var(--neon-soft);
        }

        .opt:active {
            transform: translateY(-1px) scale(.99)
        }

        .opt .ico {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.4rem;
            background: rgba(61, 165, 255, .12);
            border: 1px solid var(--neon-soft);
        }

        .opt strong {
            font-size: 1.08rem;
            font-weight: 600
        }

        .opt small {
            color: var(--muted);
            font-size: .86rem
        }

        details {
            margin-top: 22px;
            margin-bottom: 22px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px 18px;
        }

        summary {
            cursor: pointer;
            color: var(--neon);
            font-weight: 500;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 8px
        }

        summary::-webkit-details-marker {
            display: none
        }

        summary::before {
            content: "›";
            display: inline-block;
            transform: rotate(90deg);
            transition: .3s;
            font-size: 1.2rem
        }

        details[open] summary::before {
            transform: rotate(-90deg)
        }

        details ol {
            margin: 12px 22px 4px 0;
            color: var(--muted);
            font-size: .93rem
        }

        details li {
            margin-bottom: 4px
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px
        }

        .btn {
            font: inherit;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--glass-strong);
            transition: transform .3s cubic-bezier(.22, 1, .36, 1), box-shadow .3s, border-color .3s, background .3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: var(--neon-soft);
            background: rgba(255, 255, 255, .1)
        }

        .btn.primary {
            background: var(--neon);
            color: #031225;
            border-color: var(--neon);
            font-weight: 600
        }

        .btn.primary:hover {
            box-shadow: 0 10px 30px -8px var(--neon), 0 0 0 4px rgba(61, 165, 255, .15);
            background: #5bb4ff
        }

        .status {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 18px 20px;
            border-radius: 20px;
            margin: 6px 0 22px;
            border: 1px solid var(--c);
            background: color-mix(in srgb, var(--c) 10%, transparent);
        }

        .status.ok {
            --c: var(--ok)
        }

        .status.warn {
            --c: var(--warn)
        }

        .status.bad {
            --c: var(--bad)
        }

        .status .sico {
            flex: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            background: color-mix(in srgb, var(--c) 18%, transparent);
            color: var(--c);
        }

        .status h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--c);
            margin-bottom: 2px
        }

        .status p {
            color: #cdd5e3;
            font-size: .95rem
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px
        }

        .chip {
            padding: 5px 12px;
            border-radius: 999px;
            font-size: .8rem;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            color: var(--muted)
        }

        .video {
            position: relative;
            aspect-ratio: 16/9;
            border-radius: 22px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            box-shadow: 0 0 0 1px var(--neon-soft), 0 24px 60px -24px var(--neon-soft);
            margin-bottom: 16px;
        }

        .video iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0
        }

        .video.empty {
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--muted);
            padding: 20px;
            background: rgba(255, 255, 255, .03);
            box-shadow: none
        }

        /* معرض الصور الجديد */
        .gallery-section {
            margin-top: 22px
        }

        .gallery-section h4 {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 12px
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px
        }

        .gallery-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid var(--border);
            transition: transform .3s, border-color .3s;
            cursor: pointer;
        }

        .gallery-img:hover {
            transform: scale(1.03);
            border-color: var(--neon)
        }

        .tools {
            margin-top: 22px;
            display: grid;
            gap: 10px
        }

        .tools h4 {
            font-weight: 600;
            font-size: 1rem
        }

        .tool {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-decoration: none;
            color: var(--text);
            padding: 14px 18px;
            border-radius: 16px;
            background: var(--glass-strong);
            border: 1px solid var(--border);
            transition: .3s;
        }

        .tool:hover {
            border-color: var(--neon);
            transform: translateX(-4px);
            box-shadow: 0 10px 30px -16px var(--neon-soft)
        }

        .tool span {
            color: var(--neon);
            font-size: .85rem;
            white-space: nowrap
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: .8rem;
            margin-top: 30px
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                animation: none !important
            }
        }
    </style>
</head>

<body>
    <div class="orb a"></div>
    <div class="orb b"></div>

    <div class="wrap">
        <header>
            <span class="badge"><i></i> PlayStation 5</span>
            <h1 id="siteTitle">اختر جهازك، واحصل على الشرح المناسب</h1>
            <p id="siteSubtitle">ثلاث خطوات بسيطة فقط لتصلك إلى الفيديو الخاص بإصدار جهازك.</p>
        </header>

        <div class="progress" id="progress">
            <div class="dot active" data-i="1"><b>1</b><span>نوع الجهاز</span></div>
            <div class="line"></div>
            <div class="dot" data-i="2"><b>2</b><span>الإصدار</span></div>
            <div class="line"></div>
            <div class="dot" data-i="3"><b>3</b><span>النتيجة</span></div>
        </div>

        <main class="card">
            <section class="step show in" id="step1">
                <h2>ما نوع جهازك؟</h2>
                <p class="sub">اختر النسخة التي تملكها.</p>
                <div class="options" id="editionOptions"></div>
            </section>

            <section class="step" id="step2">
                <h2>ما إصدار النظام (Firmware)؟</h2>
                <p class="sub">اختر الإصدار المثبّت على جهازك حالياً.</p>
                <details>
                    <summary>كيف أعرف رقم الإصدار؟</summary>
                    <ol id="howToList"></ol>
                </details>
                <div class="options" id="fwOptions"></div>
                <div class="actions"><button class="btn" data-back>→ رجوع</button></div>
            </section>

            <section class="step" id="step3">
                <div id="resultBox"></div>
                <div class="actions">
                    <button class="btn" data-back>→ رجوع</button>
                    <button class="btn primary" id="restartBtn">ابدأ من جديد</button>
                </div>
            </section>
        </main>

        <footer id="footerText"></footer>
    </div>

    <script>
        /* ==========================================================================
           ██████  منطقة البيانات - عدّل هنا بسهولة  ██████
           ========================================================================== */

        const SITE = {
            title: "اختر جهازك، واحصل على الشرح المناسب",
            subtitle: "ثلاث خطوات بسيطة فقط لتصل إلى الفيديو الخاص بإصدار جهازك.",
            footer: "هذه الصفحة للأغراض التعليمية. أنت المسؤول عن جهازك؛ تأكد من فهم المخاطر قبل أي خطوة."
        };

        const EDITIONS = [
            { id: "disc", icon: "💿", name: "PS5 Disc Edition", desc: "النسخة التي تحتوي على قارئ أقراص" },
            { id: "digital", icon: "☁️", name: "PS5 Digital Edition", desc: "النسخة الرقمية بدون قارئ أقراص" }
        ];

        const HOW_TO_FIND_VERSION = [
            "افتح الإعدادات (Settings) من الشاشة الرئيسية.",
            "اذهب إلى: النظام (System).",
            "اختر: برنامج النظام (System Software).",
            "اختر: معلومات (Console Information).",
            "سيظهر رقم الإصدار (Version) مثل 4.03 أو 6.50."
        ];

        /* 
          دليل إضافة الإصدارات والفيديوهات والصور:
          -----------------------------------------
          1. videoId : ضع معرّف فيديو يوتيوب الرئيسي (مثال: "dQw4w9WgXcQ")
          2. images  : ضع روابط الصور التوضيحية بين أقواس ["url1", "url2"]
          3. tools   : ضع قائمة بالروابط والأدوات
        */
        const FIRMWARES = [
            {
                id: "fw-3-4",
                label: "الإصدارات 3.xx و 4.xx",
                hint: "مثال: 3.20 ، 4.03 ، 4.51",
                status: "ok",
                statusTitle: "متوافق تماماً",
                statusText: "هذا الإصدار مدعوم بالكامل ويوجد شرح مفصل بالفيديو أدناه.",
                videoId: "dQw4w9WgXcQ", // ضع ID فيديو يوتيوب هنا
                videos: {
                    disc: "dQw4w9WgXcQ",   // فيديو خاص بنسخة الأقراص
                    digital: "dQw4w9WgXcQ" // فيديو خاص بالنسخة الرقمية
                },
                images: [
                    "https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=500&q=80",
                    "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500&q=80"
                ],
                tools: [
                    { name: "تحميل أداة الشرح (Payload)", url: "https://example.com/download" },
                    { name: "رابط الموقع المساعد (Host)", url: "https://example.com/host" }
                ]
            },
            {
                id: "fw-5",
                label: "الإصدارات 5.xx",
                hint: "مثال: 5.02 ، 5.50",
                status: "warn",
                statusTitle: "يتطلب خطوات معينة",
                statusText: "تأكد من اتباع الخطوات الموضحة قبل تنفيذ العملية.",
                videoId: "", // اتركه فارغاً إذا كان سيتوفر قريباً
                images: [],
                tools: []
            },
            {
                id: "fw-6",
                label: "الإصدارات 6.xx",
                hint: "مثال: 6.02 ، 6.50",
                status: "warn",
                statusTitle: "دعم جزئي",
                statusText: "يتوفر دعم لبعض الميزات فقط في الوقت الحالي.",
                videoId: "",
                images: [],
                tools: []
            },
            {
                id: "fw-7plus",
                label: "إصدارات أحدث (7.xx+)",
                hint: "7.00 وما فوق",
                status: "bad",
                statusTitle: "غير متوافق حالياً",
                statusText: "لا توجد طريقة معروفة لهذا الإصدار حالياً. نوصي بعدم تحديث الجهاز.",
                videoId: "",
                images: [],
                tools: []
            }
        ];

        /* ==========================================================================
           ██████  المحرك البرمجي  ██████
           ========================================================================== */

        const STATUS_ICON = { ok: "✓", warn: "!", bad: "✕" };
        const state = { edition: null, fw: null, step: 1 };
        const $ = (s, r = document) => r.querySelector(s);
        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        function init() {
            $("#siteTitle").textContent = SITE.title;
            $("#siteSubtitle").textContent = SITE.subtitle;
            $("#footerText").textContent = SITE.footer;
            $("#howToList").innerHTML = HOW_TO_FIND_VERSION.map(t => `<li>${esc(t)}</li>`).join("");

            $("#editionOptions").innerHTML = EDITIONS.map(e => `
    <button class="opt" data-edition="${esc(e.id)}">
      <span class="ico">${e.icon}</span>
      <strong>${esc(e.name)}</strong>
      <small>${esc(e.desc)}</small>
    </button>`).join("");

            $("#editionOptions").addEventListener("click", e => {
                const b = e.target.closest("[data-edition]"); if (!b) return;
                state.edition = EDITIONS.find(x => x.id === b.dataset.edition);
                renderFirmwares();
                go(2);
            });

            $("#fwOptions").addEventListener("click", e => {
                const b = e.target.closest("[data-fw]"); if (!b) return;
                state.fw = FIRMWARES.find(x => x.id === b.dataset.fw);
                renderResult();
                go(3);
            });

            document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => go(state.step - 1, true)));
            $("#restartBtn").addEventListener("click", () => { state.edition = state.fw = null; go(1, true); });
        }

        function renderFirmwares() {
            const list = FIRMWARES.filter(f => !f.onlyFor || f.onlyFor.includes(state.edition.id));
            $("#fwOptions").innerHTML = list.map(f => `
    <button class="opt" data-fw="${esc(f.id)}">
      <strong>${esc(f.label)}</strong>
      ${f.hint ? `<small>${esc(f.hint)}</small>` : ""}
    </button>`).join("");
        }

        function renderResult() {
            const f = state.fw, ed = state.edition;
            const vid = (f.videos && f.videos[ed.id]) || f.videoId || "";

            const video = vid
                ? `<div class="video"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(vid)}?rel=0"
         title="فيديو الشرح" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
                : `<div class="video empty"><div>🎬<br>فيديو الشرح لهذا الإصدار سيتوفر قريباً</div></div>`;

            const images = (f.images && f.images.length)
                ? `<div class="gallery-section">
        <h4>صور توضيحية</h4>
        <div class="gallery-grid">
          ${f.images.map(img => `<a href="${esc(img)}" target="_blank"><img class="gallery-img" src="${esc(img)}" alt="صورة توضيحية" /></a>`).join("")}
        </div>
       </div>`
                : "";

            const tools = (f.tools && f.tools.length)
                ? `<div class="tools"><h4>الأدوات والروابط</h4>${f.tools.map(t =>
                    `<a class="tool" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">${esc(t.name)}<span>فتح ↗</span></a>`).join("")}</div>`
                : "";

            $("#resultBox").innerHTML = `
    <h2>نتيجتك جاهزة</h2>
    <p class="sub">بناءً على اختيارك:</p>
    <div class="chips"><span class="chip">${esc(ed.name)}</span><span class="chip">${esc(f.label)}</span></div>
    <div class="status ${esc(f.status)}">
      <div class="sico">${STATUS_ICON[f.status] || "i"}</div>
      <div><h3>${esc(f.statusTitle)}</h3><p>${esc(f.statusText)}</p></div>
    </div>
    ${video}
    ${images}
    ${tools}`;
        }

        function go(n, back = false) {
            n = Math.max(1, Math.min(3, n));
            const cur = $("#step" + state.step), nxt = $("#step" + n);
            if (cur === nxt) return;
            cur.classList.remove("in"); cur.classList.add("out");
            setTimeout(() => {
                cur.classList.remove("show", "out");
                nxt.classList.remove("in", "back-in");
                if (back) nxt.classList.add("back-in");
                nxt.classList.add("show");
                void nxt.offsetWidth;
                nxt.classList.add("in");
                state.step = n;
                updateProgress();
                window.scrollTo({ top: 0, behavior: "smooth" });
            }, 260);
        }

        function updateProgress() {
            document.querySelectorAll(".dot").forEach(d => {
                const i = +d.dataset.i;
                d.classList.toggle("active", i === state.step);
                d.classList.toggle("done", i < state.step);
            });
        }

        init();
    </script>
</body>

</html>
